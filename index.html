      "url": "https://www.layer-form.de/",

    <link rel="icon" href="/favicon.ico" sizes="48x48">
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96x96.png">
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192x192.png">
    <link rel="preload" as="image" href="/projects/designlampe.webp" fetchpriority="high">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="manifest" href="/site.webmanifest">
</head>
<body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
    <!-- HubSpot wird erst nach freiwilliger Einwilligung geladen. -->
    <script>
      (() => {
        const key = 'layerform:hubspot-consent:v1';
        const loadHubSpot = () => {
          if (document.getElementById('hs-script-loader')) return;
          const script = document.createElement('script');
          script.id = 'hs-script-loader';
          script.async = true;
          script.src = 'https://js-eu1.hs-scripts.com/149524579.js';
          document.body.appendChild(script);
        };
        const readConsent = () => {
          try { return localStorage.getItem(key); } catch { return null; }
        };
        const saveConsent = (value) => {
          try { localStorage.setItem(key, value); } catch {}
        };
        const banner = document.createElement('aside');
        banner.setAttribute('aria-label', 'Datenschutzeinstellungen für HubSpot');
        banner.style.cssText = 'position:fixed;z-index:9999;bottom:16px;left:16px;right:16px;max-width:560px;margin:auto;padding:20px;border:1px solid #285075;border-radius:12px;background:#08182d;color:#f3f8ff;box-shadow:0 18px 60px #0009;font:15px/1.5 system-ui,sans-serif';
        banner.innerHTML = '<strong style="font-size:17px">Optionale HubSpot-Funktionen</strong><p style="margin:8px 0 16px">Mit Ihrer Zustimmung laden wir HubSpot für zusätzliche Website-Funktionen. Dabei kann eine Verbindung zu HubSpot entstehen. Das Kontaktformular funktioniert auch ohne Zustimmung. Weitere Details finden Sie über den Link „Datenschutz“ im Footer.</p><div style="display:flex;flex-wrap:wrap;gap:10px"><button type="button" data-choice="reject" style="cursor:pointer;padding:10px 16px;border-radius:10px;border:1px solid #8da6bb;background:transparent;color:white;font:inherit">Ablehnen</button><button type="button" data-choice="accept" style="cursor:pointer;padding:10px 16px;border-radius:10px;border:0;background:#00d7f2;color:#00172c;font:inherit;font-weight:700">Zustimmen</button></div>';
        const settings = document.createElement('button');
        settings.type = 'button';
        settings.textContent = 'HubSpot-Einstellungen';
        settings.setAttribute('aria-label', 'HubSpot-Datenschutzeinstellungen öffnen');
        settings.style.cssText = 'position:fixed;z-index:9998;bottom:8px;left:8px;border:1px solid #3b5872;border-radius:999px;padding:7px 11px;background:#08182d;color:#e7f5ff;font:12px system-ui,sans-serif;cursor:pointer';
        settings.addEventListener('click', () => { settings.remove(); banner.hidden = false; document.body.appendChild(banner); banner.querySelector('[data-choice="reject"]').focus(); });
        banner.querySelector('[data-choice="reject"]').addEventListener('click', () => {
          const previouslyAccepted = readConsent() === 'accepted';
          saveConsent('rejected'); banner.remove(); document.body.appendChild(settings);
          // Bereits geladenes HubSpot kann nur durch Neuladen vollständig beendet werden.
          if (previouslyAccepted) window.location.reload();
        });
        banner.querySelector('[data-choice="accept"]').addEventListener('click', () => {
          saveConsent('accepted'); banner.remove(); document.body.appendChild(settings); loadHubSpot();
        });
        const state = readConsent();
        if (state === 'accepted') { loadHubSpot(); document.body.appendChild(settings); }
        else if (state === 'rejected') document.body.appendChild(settings);
        else document.body.appendChild(banner);
      })();
    </script>
</body>
</html>
