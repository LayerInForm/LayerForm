    <style>
        body {
            font-family: 'Outfit', system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
            background: #fff; color: #001C47;
            -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
            overflow-x: hidden;
        }
        html { scroll-behavior: smooth; scroll-padding-top: 6rem; }
        h1, h2, h3, h4, .font-display { font-family: 'Outfit', system-ui, sans-serif; letter-spacing: -0.025em; }

        /* Buttons in Pillenform, wie die runden Kanten im Logo */
        .btn-primary, .btn-ghost, .btn-ghost-dark {
            display: inline-flex; align-items: center; justify-content: center; gap: .5rem;
            padding: .85rem 1.6rem; border-radius: 9999px; font-weight: 600; font-size: 1rem;
            transition: background-color .2s, border-color .2s, color .2s, box-shadow .2s;
        }
        .btn-primary { background: #00E5FF; color: #001C47; box-shadow: 0 8px 24px -8px rgba(0,229,255,.6); }
        .btn-primary:hover { background: #7FF3FF; }
        .btn-ghost { border: 1.5px solid #DCE8EE; color: #001C47; background: #fff; }
        .btn-ghost:hover { border-color: #001C47; }
        .btn-ghost-dark { border: 1.5px solid rgba(255,255,255,.2); color: #fff; }
        .btn-ghost-dark:hover { border-color: rgba(255,255,255,.6); }
        :focus-visible { outline: 2px solid #00E5FF; outline-offset: 3px; }

        /* Hero-Hintergrund: Farbverlauf wie die Würfelseiten */
        .hero-bg {
            background:
              radial-gradient(60% 70% at 78% 45%, rgba(0,229,255,.22), transparent 60%),
              radial-gradient(50% 60% at 95% 100%, rgba(8,36,111,.9), transparent 70%),
              #04112B;
        }
        .grid-lines {
            background-image:
              linear-gradient(rgba(255,255,255,.045) 1px, transparent 1px),
              linear-gradient(90deg, rgba(255,255,255,.045) 1px, transparent 1px);
            background-size: 56px 56px;
            mask-image: radial-gradient(ellipse at 70% 40%, #000 20%, transparent 75%);
            -webkit-mask-image: radial-gradient(ellipse at 70% 40%, #000 20%, transparent 75%);
        }

        /* ---------- Effekte ---------- */

        /* Würfel baut sich Schicht für Schicht auf, schwebt danach leicht */
        .slab { animation: layer-in .55s cubic-bezier(.2,.8,.2,1) both; }
        @keyframes layer-in { from { opacity: 0; transform: translateY(-38px); } to { opacity: 1; transform: none; } }
        .cube-float { animation: float 6s ease-in-out 1.4s infinite; }
        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-14px); } }

        /* Leuchtende "Scan"-Linie, die über den Würfel fährt */
        .scan-line {
            position: absolute; left: 14%; right: 14%; top: 8%; height: 2px; opacity: 0; pointer-events: none;
            background: linear-gradient(90deg, transparent, #00E5FF, transparent);
            box-shadow: 0 0 18px 2px rgba(0,229,255,.7);
            animation: scan 5.5s ease-in-out 1.8s infinite;
        }
        @keyframes scan {
            0% { top: 8%; opacity: 0; } 8% { opacity: 1; }
            55% { top: 90%; opacity: 1; } 62%, 100% { top: 90%; opacity: 0; }
        }

        /* Aufsteigende Druckpartikel */
        .particle {
            position: absolute; bottom: 12%; border-radius: 2px; opacity: 0;
            background: #00E5FF; box-shadow: 0 0 10px #00E5FF;
            animation: rise linear infinite;
        }
        @keyframes rise {
            0% { transform: translateY(0) rotate(0); opacity: 0; }
            15% { opacity: .85; }
            100% { transform: translateY(-340px) rotate(180deg); opacity: 0; }
        }

        .glow-pulse { animation: glow 4s ease-in-out infinite; }
        @keyframes glow { 0%, 100% { opacity: .7; } 50% { opacity: 1; } }

        .grid-drift { animation: drift 24s linear infinite; }
        @keyframes drift { to { background-position: 56px 56px, 56px 56px; } }

        /* Schimmernder Text */
        .shimmer-text {
            background: linear-gradient(100deg, #fff 0%, #fff 35%, #00E5FF 50%, #fff 65%, #fff 100%);
            background-size: 250% 100%;
            -webkit-background-clip: text; background-clip: text; color: transparent;
            animation: shimmer 4.5s ease-in-out 1.2s infinite;
        }
        @keyframes shimmer { 0% { background-position: 100% 0; } 60%, 100% { background-position: 0% 0; } }

        /* Sterne ploppen nacheinander auf */
        .star-pop { animation: pop .45s cubic-bezier(.3,1.6,.5,1) both; }
        @keyframes pop { from { transform: scale(0); opacity: 0; } to { transform: scale(1); opacity: 1; } }

        /* Lichtreflex über den Hauptbutton */
        .btn-primary { position: relative; overflow: hidden; isolation: isolate; }
        .btn-primary::after {
            content: ''; position: absolute; inset: 0; z-index: -1;
            background: linear-gradient(110deg, transparent 30%, rgba(255,255,255,.7) 50%, transparent 70%);
            transform: translateX(-120%); transition: transform .7s ease;
        }
        .btn-primary:hover::after { transform: translateX(120%); }
        .btn-primary:hover { box-shadow: 0 10px 34px -6px rgba(0,229,255,.8); transform: translateY(-1px); }
        .btn-primary, .btn-ghost, .btn-ghost-dark { transition: background-color .2s, border-color .2s, color .2s, box-shadow .25s, transform .25s; }

        /* Icons hüpfen beim Überfahren der Karte */
        .group:hover .icon-hop { animation: hop .5s cubic-bezier(.3,1.6,.5,1); }
        @keyframes hop { 40% { transform: translateY(-6px) rotate(-6deg); } }
        .orb { animation: orb 9s ease-in-out infinite; }
        @keyframes orb { 50% { transform: translate(-40px, 30px) scale(1.15); } }

        /* Umlaufender Leuchtrahmen (Kontaktkarte) */
        @property --angle { syntax: '<angle>'; initial-value: 0deg; inherits: false; }
        .glow-border { position: relative; overflow: hidden; background: #0A1F4A; }
        .glow-border::before {
            content: ''; position: absolute; inset: -50%;
            background: conic-gradient(from var(--angle), transparent 0 65%, #19B2D9 78%, #00E5FF 88%, transparent 100%);
            animation: spin 7s linear infinite;
        }
        .glow-border > * { position: relative; }
        @keyframes spin { to { --angle: 360deg; } }

        /* Laufband */
        .marquee { overflow: hidden; mask-image: linear-gradient(90deg, transparent, #000 8%, #000 92%, transparent); -webkit-mask-image: linear-gradient(90deg, transparent, #000 8%, #000 92%, transparent); }
        .marquee-track { animation: marquee 38s linear infinite; }
        .marquee:hover .marquee-track { animation-play-state: paused; }
        @keyframes marquee { to { transform: translateX(-50%); } }

        /* Scroll-Fortschritt */
        .progress-bar { background: linear-gradient(90deg, #00E5FF, #19B2D9, #08246F); box-shadow: 0 0 10px rgba(0,229,255,.6); }

        @media (prefers-reduced-motion: reduce) {
            html { scroll-behavior: auto; }
            .slab, .cube-float, .scan-line, .particle, .glow-pulse, .grid-drift, .shimmer-text,
            .star-pop, .orb, .glow-border::before, .group:hover .icon-hop, .marquee-track { animation: none !important; }
            .scan-line, .particle { display: none; }
            .shimmer-text { color: #fff; background: none; }
        }

        /* Platzhalter für Projektbilder */
        .layer-placeholder {
            background:
              repeating-linear-gradient(to bottom, transparent 0 7px, rgba(0,121,160,.10) 7px 8px),
              linear-gradient(160deg, #E3F6FB, #CFE6F0);
        }

        /* Kompatibilität für bestehende Komponenten (Shop, Formular, Rechtstexte) */
        .glass { background: rgba(255,255,255,.9); border: 1px solid #DCE8EE; }
        .glass-cyan { background: rgba(0,229,255,.06); border: 1px solid rgba(0,180,216,.25); }
        .transition-soft { transition: all .4s cubic-bezier(0.16, 1, 0.3, 1); }
    </style>
